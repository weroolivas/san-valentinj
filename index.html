<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>¿Quieres ser mi San Valentín? 💖</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Dancing+Script:wght@700&display=swap');

        body {
            font-family: 'Dancing Script', cursive;
            text-align: center;
            background: linear-gradient(135deg, #ff9a9e, #fad0c4);
            color: white;
            margin: 0;
            padding: 0;
            overflow: hidden;
        }

        .container {
            position: relative;
            top: 20vh;
            background: rgba(0, 0, 0, 0.5);
            padding: 30px;
            border-radius: 15px;
            display: inline-block;
            box-shadow: 0px 0px 15px rgba(0, 0, 0, 0.3);
        }

        h1 {
            font-size: 2.5em;
            margin: 0;
        }

        .buttons {
            margin-top: 20px;
        }

        button {
            font-size: 20px;
            padding: 12px 25px;
            margin: 10px;
            border: none;
            cursor: pointer;
            border-radius: 50px;
            transition: 0.3s;
        }

        .yes {
            background-color: #ff4d6d;
            color: white;
            box-shadow: 0px 4px 8px rgba(255, 77, 109, 0.5);
        }

        .yes:hover {
            background-color: #e60039;
            transform: scale(1.1);
        }

        .no {
            background-color: #cccccc;
            color: black;
            position: absolute;
        }

        /* Animación de corazones flotando */
        .heart {
            position: absolute;
            color: #ff4d6d;
            font-size: 30px;
            animation: floatUp linear infinite;
        }

        @keyframes floatUp {
            from {
                transform: translateY(100vh) scale(1);
                opacity: 1;
            }
            to {
                transform: translateY(-10vh) scale(0.5);
                opacity: 0;
            }
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>¿Quieres ser mi San Valentín? 💖</h1>
        <div class="buttons">
            <button class="yes" onclick="showMessage()">Sí 💕</button>
            <button class="no" onmouseover="moveButton()">No 😢</button>
        </div>
    </div>

    <script>
        function moveButton() {
            let btn = document.querySelector(".no");
            let x = Math.random() * (window.innerWidth - btn.offsetWidth);
            let y = Math.random() * (window.innerHeight - btn.offsetHeight);
            btn.style.left = ${x}px;
            btn.style.top = ${y}px;
        }

        function showMessage() {
            document.body.innerHTML = `
                <div style="display:flex;flex-direction:column;justify-content:center;align-items:center;height:100vh;color:white;font-size:2em;">
                    <p>Sabía que dirías que sí! 💖😍</p>
                    <p>Te amo! ❤</p>
                </div>
            `;
        }

        // Generar corazones animados
        function createHeart() {
            let heart = document.createElement("div");
            heart.innerHTML = "❤";
            heart.classList.add("heart");
            document.body.appendChild(heart);

            let size = Math.random() * 20 + 10;
            heart.style.fontSize = size + "px";
            heart.style.left = Math.random() * 100 + "vw";
            heart.style.animationDuration = Math.random() * 5 + 3 + "s";

            setTimeout(() => {
                heart.remove();
            }, 8000);
        }

        setInterval(createHeart, 500);
    </script>

</body>
</html>
